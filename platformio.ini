; Leak rig DAQ REV-C - ESP32 DevKit V1 (DOIT, 30-pin) + ADS1115 + 3 x MPX5010DP + 4 x BME/BMP280
; Build: checkmark in the bottom bar.  Upload: right arrow.  Serial Monitor: plug icon.

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

monitor_speed = 115200
monitor_echo = yes          ; show what you type (z, cal A, slope 2.5 10, ...)
monitor_eol = LF
monitor_filters = esp32_exception_decoder, csvlog   ; csvlog = monitor/filter_csvlog.py, saves runs to logs/

extra_scripts = tools/pio_targets.py   ; adds "Analyze latest run" to the PlatformIO sidebar

lib_deps =
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit ADS1X15 @ ^2.5.0
    adafruit/Adafruit Unified Sensor @ ^1.1.14
